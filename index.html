<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tải Ứng Dụng / Download App</title>
    <!-- Import Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --android-color: #3ddc84;
            --ios-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--primary-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        /* Hiệu ứng trang trí nền phía sau */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            opacity: 0.4;
        }
        body::before {
            background: #4f46e5;
            top: -50px;
            left: -50px;
        }
        body::after {
            background: #06b6d4;
            bottom: -50px;
            right: -50px;
        }

        /* Container chính kiểu Glassmorphism */
        .container {
            position: relative;
            z-index: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 40px 30px;
            border-radius: 32px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Logo Ứng dụng placeholder */
        .app-logo-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 24px;
        }

        .app-logo {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #6366f1, #3b82f6);
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: #fff;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }

        /* Hiệu ứng radar quét xung quanh logo khi đang tự động chuyển hướng */
        .radar-pulse {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 24px;
            border: 2px solid #6366f1;
            animation: pulse 2s ease-out infinite;
            z-index: -1;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .status-text {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-text i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Nút bấm Store hiện đại */
        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-store {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 24px;
            border-radius: 18px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-store i {
            font-size: 28px;
            margin-right: 16px;
            width: 32px;
            text-align: center;
        }

        .btn-text {
            text-align: left;
        }

        .btn-text .sub {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            display: block;
            margin-bottom: 2px;
        }

        .btn-text .main {
            font-size: 16px;
            font-weight: 600;
        }

        .btn-store .arrow-icon {
            margin-left: auto;
            font-size: 16px;
            color: var(--text-muted);
            transition: transform 0.3s;
        }

        /* Hiệu ứng Hover chuẩn chỉnh */
        .btn-store:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .btn-store:hover .arrow-icon {
            transform: translateX(4px);
            color: #fff;
        }

        /* Class đặc biệt để làm nổi bật hệ điều hành tương ứng của user */
        .btn-store.detected {
            background: rgba(255, 255, 255, 0.95);
            color: #0f172a;
            box-shadow: 0 15px 30px rgba(255, 255, 255, 0.1);
            border-color: #fff;
        }
        .btn-store.detected .sub { color: #64748b; }
        .btn-store.detected .arrow-icon { color: #0f172a; }
        
        .btn-store.detected#btn-android i { color: #24b865; }
        .btn-store.detected#btn-ios i { color: #000000; }

        /* Bản quyền / Footer nhỏ */
        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="app-logo-wrapper">
            <!-- Bạn có thể thay icon bên dưới bằng thẻ <img src="link-logo.png"> nếu có logo riêng -->
            <div class="app-logo">
               <img src="App_Logo.png" style="width: 90px; height: 90px; border-radius: 24px; object-fit: cover; box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);">
            </div>
            <div class="radar-pulse" id="radar"></div>
        </div>

        <h1 id="app-title">PAWII</h1>
        
        <div class="status-text" id="status-container">
            <i class="fa-solid fa-circle-notch"></i>
            <span id="status-msg">Đang tự động chuyển hướng...</span>
        </div>

        <div class="btn-list">
            <!-- NÚT APPLE STORE -->
            <a href="https://apps.apple.com/app/id6762113467" class="btn-store" id="btn-ios">
                <i class="fa-brands fa-apple"></i>
                <div class="btn-text">
                    <span class="sub">Download on the</span>
                    <span class="main">App Store</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <!-- NÚT GOOGLE PLAY -->
            <a href="https://play.google.com/store/apps/details?id=com.raymond.pawii" class="btn-store" id="btn-android">
                <i class="fa-brands fa-google-play"></i>
                <div class="btn-text">
                    <span class="sub">Get it on</span>
                    <span class="main">Google Play</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>
        </div>

        <div class="footer">
            &copy; 2026 Toàn bộ quyền sở hữu thuộc về Huynh Le Duy Dang
        </div>
    </div>

    <script>
        // === CẤU HÌNH ĐƯỜNG LINK APP CỦA BẠN TẠI ĐÂY ===
        const iosStoreUrl = "https://apps.apple.com/app/id6762113467";
        const androidStoreUrl = "https://play.google.com/store/apps/details?id=com.raymond.pawii";

        function handleRedirect() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const btnIos = document.getElementById('btn-ios');
            const btnAndroid = document.getElementById('btn-android');
            const statusMsg = document.getElementById('status-msg');
            const radar = document.getElementById('radar');

            // 1. Kiểm tra nếu là iOS (iPhone / iPad)
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                btnIos.classList.add('detected'); // Làm sáng nút iOS lên thu hút
                setTimeout(() => {
                    window.location.href = iosStoreUrl;
                }, 800); // Chờ hiệu ứng sóng radar 0.8s rồi chuyển hướng
            } 
            // 2. Kiểm tra nếu là Android
            else if (/android/i.test(userAgent)) {
                btnAndroid.classList.add('detected'); // Làm sáng nút Android lên thu hút
                setTimeout(() => {
                    window.location.href = androidStoreUrl;
                }, 800);
            } 
            // 3. Nếu lướt bằng Máy tính (Desktop/Laptop) hoặc thiết bị khác
            else {
                // Tắt trạng thái chuyển hướng tự động, giữ giao diện cho họ tự lựa chọn
                statusMsg.innerText = "Vui lòng chọn nền tảng thiết bị của bạn";
                document.querySelector('.status-text i').style.display = 'none'; 
                radar.style.display = 'none';
            }
        }

        // Kích hoạt khi trang tải xong
        window.onload = handleRedirect;
    </script>
</body>
</html>
